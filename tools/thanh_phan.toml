# thanh_phan.toml — SO DANG KY THANH PHAN
#
# ## Tep nay KHAI gi, va co y KHONG khai gi
#
# Nguyen tac: **chi khai thu khong suy ra duoc.** Moi thu suy ra duoc thi suy,
# vi mot ban khai tay se troi con mot phep suy thi khong.
#
#   suy ra duoc  → KHONG khai o day
#     · danh sach app          → `apps/*/manifest.py` da la SSOT (registry.py nap)
#     · test nao thuoc phan nao → suy tu IMPORT trong `tests/*.py`
#     · phu thuoc giua cac phan → suy tu import
#     · nguoi tieu thu          → dao nguoc do thi import
#
#   KHONG suy ra duoc → khai o day
#     · ranh gioi cua phan khong-phai-app (platform_core, server chia the nao)
#     · TAI NGUYEN doc quyen ma test cua phan do can
#     · muc he trong (criticality)
#     · **canh DONG ma phep do tinh khong nhin thay** — xem [canh_dong]
#
# ## Vi sao TOML chu khong JSON
#
# Kho nay dung JSON cho baseline (`i18n_baseline.json`, ...) va do la dung viec:
# baseline la SO, khong can giai thich. So dang ky nay thi nguoc lai — gia tri
# cua no nam o **vi sao** moi canh ton tai, va JSON khong giu duoc chu thich.
# `tomllib` co san trong Python 3.11+, chi doc, khong them phu thuoc.

# =============================================================================
# TAI NGUYEN — thu chi mot viec duoc dung mot luc, TREN CA MAY
# =============================================================================
#
# 🔴 Vi sao can: do 2026-09-02. Hai phien Claude cung chay gate; luot
#    `--vong-lap` cua phien nay treo qua 5 phut trong khi binh thuong ~15 giay.
#    Khong ai sai ca — `--vong-lap` co y **khong** xep hang (`gate.py:main`), va
#    do la quyet dinh dung: chan mot vong lap ngan sau mot luot day du 6 phut la
#    giet dung cai lam no huu dung.
#
# ⇒ Cai sai khong phai "xep hang hay khong". La **xep hang theo mot khoa duy
#   nhat cho moi thu**. Hai viec khong dung chung tai nguyen thi khong co ly do
#   phai doi nhau.

[tai_nguyen.cpu_nhieu]
mo_ta = "Lay -n auto = MOI loi. Hai luot cung luc chi chia doi cung chiec banh."
doc_quyen = true

[tai_nguyen.postgres_test]
mo_ta = "CSDL test dung chung. Hai luot cung luc lam ban du lieu cua nhau."
doc_quyen = true

[tai_nguyen.cong_8100]
mo_ta = "Cong web cuc bo. Mot tien trinh mot luc."
doc_quyen = true

[tai_nguyen.gpu0]
mo_ta = "GPU may A (5060 Ti). Chia se voi ltt_voice va upscalevideo."
doc_quyen = true

[tai_nguyen.mang_that]
mo_ta = "Goi ra Internet that (canary production, Cloudflare). Co han ngach."
doc_quyen = true

[tai_nguyen.tep_test_ghi]
mo_ta = """
Bon tep ma BO TEST ghi vao cay va buoc kiem TINH doc.
Da gay `OSError: [Errno 22]` tren Windows ngay 2026-08-29 va lam hai phien mat
gan tron mot ngay. Xem `gate.py::TEP_KHONG_DUOC_DOC_SONG_SONG`."""
doc_quyen = true

# =============================================================================
# CANH DONG — phu thuoc that ma AST/grep KHONG nhin thay
# =============================================================================
#
# 🔴 Day la muc quan trong nhat cua tep nay, va la ly do no ton tai duoi dang
#    du lieu chu khong phai mot doan van trong CLAUDE.md.
#
#    Do 2026-09-02: `sdk/ltt_cai_dat_cli.py` khong module nao import, khong
#    trang nao link, khong route nao goi ham trong no. Moi phep do tinh cham no
#    la CHET. **No khong chet** — no la duong DUY NHAT cho khach macOS/Linux,
#    phuc vu qua mot dict tra bang CHUOI.
#
# ⇒ Mot canh bao bang van xuoi thi phien sau phai NHO. Mot canh trong tep nay
#   thi cong cu TU BIET. Do la khac biet giua mot luat va mot phep do.

[[canh_dong]]
tu = "server/routes/tai_lieu_api.py"
toi = ["sdk/"]
co_che = "GOI_TAI — dict tra bang CHUOI, phuc vu o /tai/<ten>"
bang_chung = "server/routes/tai_lieu_api.py:124"

[[canh_dong]]
tu = "platform_core/registry.py"
toi = ["apps/"]
co_che = "iterdir() + importlib.import_module(f'apps.{ten}.manifest')"
bang_chung = "platform_core/registry.py:894,927,966"

[[canh_dong]]
tu = "server/templating.py"
toi = ["server/templates/", "server/static/"]
co_che = "BUILT_PAGES / PUBLIC_LINKS — tra bang CHUOI"
bang_chung = "server/templating.py:119,204"

[[canh_dong]]
tu = "server/nexus_download.py"
toi = ["nexus_agent/"]
co_che = "_CONTENT_TYPE — tra bang CHUOI"
bang_chung = "server/nexus_download.py:30"

[[canh_dong]]
tu = "tools/audit_public_web.py"
toi = ["docs/lttstudios-website/route-map.json"]
co_che = "doc tep JSON trong docs/ lam HOP DONG"
bang_chung = "tools/audit_public_web.py:13"

# 🔴 LOP THU BA, VA NO KHO THAY HON HAI LOP TREN.
#
#    Hai lop dau (tra bang chuoi, import dong) it nhat con MOT CHUOI trong ma
#    de ma tim. Lop nay khong co gi ca:
#
#      `_goi_moi_nhat()` QUET THU MUC bang regex ten tep roi lay `max()` phien
#      ban. Khong ban ke, khong hang so, khong ten tep nao ton tai trong kho ma.
#      Va thu muc do nam trong `data/` — **bi .gitignore**, tuc noi dung khong
#      o trong git chut nao.
#
#    Do 2026-09-02 (phien lttstudiosapp-e6 bao, da xac minh): tha mot tep
#    `LTTStudios-CamCLI-Setup-1.4.0.exe` vao `data/api_dist/` thi URL cong khai
#    **doi ngay**, khong deploy, khong commit, khong dong ma nao thay doi.
#
# ⇒ Mot tep trong `data/` co the la BE MAT PHUC VU KHACH DANG SONG. Bat cu
#   phase nao cham `data/` phai coi day la vung khong duoc don "cho sach".
#
# ⚠️ Canh nay khong tro toi mot thanh phan duoc — dich cua no khong nam trong
#    git. No o day de duoc DOC, khong de duoc tinh. Do la gioi han that, va noi
#    ra thi tot hon la giau.

[[canh_dong]]
tu = "server/routes/tai_lieu_api.py"
toi = []
co_che = """
_goi_moi_nhat() — QUET THU MUC `data/api_dist/` va `data/nexus_dist/` bang
regex ten tep, chon phien ban cao nhat. Khong ban ke, khong chuoi, khong tep
nao trong git. Tha mot tep vao do la doi be mat cong khai."""
bang_chung = "server/routes/tai_lieu_api.py:63-84"

