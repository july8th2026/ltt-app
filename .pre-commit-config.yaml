# pre-commit -- cong RE chay TRUOC moi commit, o CA SAU worktree.
#
# =========================================================================
# [!] TEP NAY CHAM HA TANG DUNG CHUNG. Doc truoc khi doi.
#
#     `git rev-parse --git-common-dir` = `.git`, nen SAU worktree dung chung
#     `D:\LTTSTUDIOSAPP\.git\hooks`. Cai hook o day co hieu luc NGAY voi moi
#     phien dang lam viec, khong co giai doan lan dan.
#
#     => Moi hook o day phai: (1) NHANH, (2) khong tai gi ve mang,
#        (3) hong thi hong AN TOAN.
# =========================================================================
#
# VI SAO CHI CO BON HOOK, VA VI SAO KHONG CO `mypy`
#
#     Do 06/09/2026:
#
#         check_ruff.py        0,18 s
#         check_xuong_dong.py  0,07 s
#         check_ranh_gioi.py   0,31 s
#         ------------------------------
#         tong                 ~0,6 s
#
#         check_mypy.py        2,2 s khi cache NONG
#                             45   s khi cache NGUOI   <- bi loai vi cai nay
#
#     Mot cay vua checkout co cache mypy rong. 45 giay cho MOI commit o mot
#     phien khac la du de nguoi ta go `--no-verify` mot lan, roi go mai. Gate
#     da chay `mypy`; hook khong can lam lai.
#
# ⛔ VI SAO DUNG BANH COC CHU KHONG DUNG `ruff` THO
#
#     Do duoc: `python -m ruff check <hai tep bat ky>` tra **rc=1**, vi kho
#     dang co 513 phat hien ton dong. Mot hook chay `ruff` tho se DO o gan nhu
#     moi commit ngay tu luot dau — va mot cong luon do la mot cong se bi tat.
#     `check_ruff.py` chi do khi so phat hien TANG.
#
# ⭐ `language: system` -- KHONG tao moi truong ao, KHONG tai goi. pre-commit
#    mac dinh dung `pip install` vao mot venv rieng cho moi hook; o may nay
#    dieu do nghia la sau worktree x N hook x mot lan tai ve. Cac cong cu nay
#    da nam trong `requirements-dev.txt` roi.
#
# Bo qua mot lan (chi khi that su can, va noi ro trong commit):
#     git commit --no-verify

repos:
  - repo: local
    hooks:
      - id: banh-coc-ruff
        name: banh coc ruff (chi do khi TANG)
        entry: python tools/check_ruff.py
        language: system
        pass_filenames: false
        # `always_run`: banh coc do TOAN KHO, khong do tep staged. Mot commit
        # chi sua tai lieu van co the lam so phat hien doi neu ai do vua sua
        # `ruff.toml` -- nen no phai chay bat ke staged co `.py` hay khong.
        always_run: true

      - id: kieu-xuong-dong
        name: kieu xuong dong (CRLF/LF khong duoc lat)
        entry: python tools/check_xuong_dong.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ranh-gioi-import
        name: ranh gioi import giua cac tang
        entry: python tools/check_ranh_gioi.py
        language: system
        pass_filenames: false
        always_run: true

      # 🔴 **Them 10/09, va no la hook DUY NHAT dung `pass_filenames`.**
      #
      #    Ly do co that, 10/09: mot byte `0x07` — dau xuoc nguoc dat truoc chu
      #    `a` trong mot chuoi Python KHONG raw — di vao
      #    `PHA15_BAO_CAO_NEN_KHO.md` va len trunk. Buoc `ky tu dieu khien` chi
      #    nam trong GATE DAY DU, nen `pre-commit` cho qua, va no NO o cay cua
      #    **nguoi ff sau** — tuc nguoi khong gay ra no.
      #
      #    ⭐ Van ban nguoi doc thay van xuoi (`secretspp.env` trong nhu mot loi
      #       go), nen doc ky hon khong bat duoc: loi chi ton tai o tang BYTE.
      #       Chu tep da doc lai chinh doan ay vai lan ma khong thay.
      #
      # 🔴 **Va chinh doan chu thich nay da sinh ra mot byte `0x07` nua khi no
      #    duoc viet.** Cong cu shell nuot mot lop dau xuoc nguoc, nen chuoi
      #    tuong la hai ky tu tro thanh mot BEL — dung co che vua mo ta, trong
      #    chinh lan sua no. `yaml.safe_load` tu choi tep, va do la thu bat duoc.
      #
      #    ⇒ Neu can viet mot day thoat vao tai lieu: **dung Write/Edit, dung
      #      ghi qua shell**, va doc lai bang `read_bytes` truoc khi tin.
      #
      # ⚠️ `pass_filenames: true` chu khong `always_run` — khac ba hook tren, va
      #    khac vi mot ly do:
      #
      #      banh coc     do TOAN KHO, nen mot commit chi sua tai lieu van co
      #                   the doi con so  ->  phai `always_run`
      #      ky tu        mot ky tu dieu khien trong tep X do mot commit CHAM
      #                   tep X dua vao   ->  chi can quet tep staged
      #
      #    Do duoc (955 tep): ca kho **0,85 giay**, hai tep `.md` **0,06 giay**.
      #    Gate van quet ca kho — hai duong tra loi hai cau khac nhau.
      - id: ky-tu-dieu-khien
        name: ky tu dieu khien trong tai lieu (chi tep dang commit)
        entry: python tools/check_ky_tu_dieu_khien.py
        language: system
        files: \.(md|txt)$

      - id: cau-hinh-thuan-ascii
        name: mypy.ini / .importlinter / *.ps1 phai thuan ASCII
        entry: python tools/check_ascii_cau_hinh.py
        language: system
        pass_filenames: false
        always_run: true

      # ⭐ HAI BANH COC NAY TRUOC DAY CHI SONG TRONG `gate.py` (buoc "chuoi chua
      #    dich" + "ban dich thieu"). Chu du an chot 24/09: BO L3. Ma L3 la thu
      #    DUY NHAT tung chay chung -- dem 23/09 chinh no bat mot loi i18n that
      #    (`plan_v1.py` nhap `_` thay vi `_ as _t`), va neu khong co no thi loi
      #    ay da vao `main` va lam do gate cua moi phien sau.
      #
      # ⇒ Ha xuong pre-commit: bat SOM hon va CHAT hon L3 (chan luc commit, khong
      #   phai cuoi phien). Gia: ~2 giay moi cai, do tren may nay.
      #
      # ⛔ `always_run` co ly do, khong phai cho chac: ca hai deu do TOAN KHO
      #    (mot chuoi chua boc o tep A bi dem du commit chi cham tep B), nen loc
      #    theo tep dang commit se bo sot -- cung ly le voi `banh coc ruff` o tren.
      - id: chuoi-chua-dich
        name: chuoi chua boc _() (chi do khi TANG)
        entry: python tools/check_i18n.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ban-dich-thieu
        name: ban dich EN thieu (chi do khi TANG)
        entry: python tools/check_dich_thieu.py
        language: system
        pass_filenames: false
        always_run: true
