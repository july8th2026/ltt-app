{# Kiểu của các thành phần dùng chung — DÙNG CHO CẢ HAI VỎ.

   🔴 VÌ SAO TÁCH RA — ĐO 25/08 BẰNG TRÌNH DUYỆT THẬT.

      Khối CSS này trước nằm **nội tuyến trong `base.html`**, tức chỉ vỏ đã đăng
      nhập mới có. `base_public.html` có khối `<style>` riêng chỉ đặt nền `body`.

   ⛔ Hậu quả: **mọi trang công khai** — `/gia-api`, `/huong-dan`,
      `/huong-dan/cong-cu` — render với `class="card"`, `class="table"` và `<pre>`
      mà **không có một luật CSS nào khớp**. Nhìn trên Chrome: các thẻ không tách
      khỏi nhau, bảng chỉ là mấy cột chữ trôi nổi, khối mã là chữ trần trên nền
      trang. Đúng những trang một người **đang cân nhắc** nhìn thấy đầu tiên.

   ⚠️ `ltt.css` KHÔNG có `.card`, `.table` hay `pre` — đừng đi tìm ở đó. Kiểu của
      hai thứ đó luôn nằm trong template, và đó chính là lý do chúng lệch nhau.
#}
<style>
    /* ── Components ─────────────────────────────────────────── */
    h1 { font-size:20px; margin:0 0 4px; }
    h2 { font-size:15px; margin:0 0 10px; }
    .page-sub { color:var(--muted); margin:0 0 20px; }

    .card {
      background:var(--panel); border:1px solid var(--line);
      border-radius:10px; padding:16px 18px; margin-bottom:14px;
    }
    .card > h2 { display:flex; align-items:center; gap:8px; }
    .card-accent { height:3px; border-radius:3px 3px 0 0; margin:-16px -18px 14px; }

    .row { display:flex; gap:14px; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap; }
    .field { display:flex; flex-direction:column; gap:5px; flex:1 1 260px; min-width:0; }
    .field label { color:var(--muted); font-size:12px; }
    .field .hint { color:var(--dim); font-size:11px; }

    /* ⚠️ CHON THEO `:not([type])` CHU KHONG CHI LIET KE `type`.

       🔴 Do bang trinh duyet 26/08: mot `<input>` KHONG co thuoc tinh `type`
          khong khop `input[type=text]` — thuoc tinh phai CO MAT thi bo chon
          moi khop. Nen `<input name="name">` (dung o dev_keys, dev_projects,
          dev_usage) va `type=search` (dev_logs, dev_tools) roi thang ra ngoai
          moi luat cua nen tang, va Chrome ve chung bang mac dinh cua no:

            duoc ve :  bg rgb(27,20,19)  1px solid  radius 6px  padding 9/10px
            roi ra  :  bg rgb(59,59,59)  2px INSET  radius 0     padding 1/2px

          Hai o do nam canh nhau trong cung mot form, cach nhau 12 pixel. Do
          chinh la thu bi goi la "giong trang HTML tho".

       ⭐ Danh sach loai TRU ngan hon va dung hon danh sach liet ke: mot loai
          `type` moi (`date`, `url`, `tel`...) tu dong duoc ve, thay vi lai roi
          ra am tham cho toi khi co nguoi chup man hinh. */
    input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]):not([type=submit]):not([type=button]):not([type=image]):not([type=hidden]),
    select, textarea {
      padding:9px 10px; border-radius:6px; border:1px solid var(--line);
      background:var(--panel2); color:var(--fg); font-size:13px; width:100%;
      font-family:inherit;
    }
    input::placeholder, textarea::placeholder { color:var(--dim); }
    input:disabled, select:disabled, textarea:disabled { opacity:.55; cursor:not-allowed; }
    input[aria-invalid=true], select[aria-invalid=true], textarea[aria-invalid=true] { border-color:var(--err); }
    textarea { min-height:74px; resize:vertical; font-family:Consolas,monospace; font-size:12px; }

    /* Checkbox/radio: chi doi MAU DAU, khong thay the bang phan tu tu ve —
       giu nguyen ngu nghia va dieu khien ban phim cua native.
       `accent-color` la mot dong, va no la ly do 5 app truoc day khong can
       phai co (`.tv-*`, `.th-*`, `.im-*`, `.clip-*`, `.up-*` moi bo tu dung
       lai mot bo chip rieng — nam lan dung mot thu la mot primitive con
       thieu, khong phai nam app cau tha). */
    input[type=checkbox], input[type=radio] {
      width:16px; height:16px; accent-color:var(--accent); flex:0 0 auto;
    }

    /* `fieldset` mac dinh cua trinh duyet la `2px groove` mau xam — mot cai
       khung noi 3D giua mot trang phang toi mau. Ba cai nhu vay tren
       /developers/keys.
       ⚠️ Bo vien la AN TOAN chu khong lieu: nam lop app dang co
       (`.tv-fieldset`, `.th-group`, `.im-group`, `.clip-group`,
       `.clip-package fieldset`) DA TU dat `border:0` — luat chung nay chi noi
       ra thu tat ca chung da lam rieng. */
    fieldset { min-width:0; margin:0 0 14px; padding:0; border:0; }
    legend { padding:0; color:var(--muted); font-size:12px; }
    /* ⚠️ `border:1px solid transparent` CHU KHONG PHAI `border:none`.

       🔴 `border:none` dat `border-style:none`, va mot bien the chi doi
          `border-color` (nhu `.btn.ghost` trong ltt.css) khong the thang lai
          duoc: khong co STYLE thi khong co vien, du mau la gi. Hau qua do
          duoc ngay 26/08 tren /developers/keys — **khong mot nut nao tren
          trang co vien, va moi nut deu do dac**, ke ca nut phu.

       ⭐ Vien trong suot cung giu chieu cao khong doi khi mot bien the them
          vien vao — khong nut nao nhay 2px so voi nut ben canh.

       ⛔ VA DUNG DOI GI KHAC O DAY. Luat nay cham MOI trang cua nen tang.
          Ban dau toi da doi `inline-block` -> `inline-flex` + `gap` +
          `white-space:nowrap` cho dep; do bang trinh duyet cho thay
          `/autosubvideo` co chin nut mau chu tu ve bang `display:grid` va
          `nowrap` se an vao chu mau ben trong chung. Khong mot nguyen nhan goc
          nao doi ba thuoc tinh do — nen chung bi bo. Can nut kieu flex thi dat
          o lop `.dev-*`, dung ep ca nen tang. */
    button, .btn {
      padding:9px 14px; border-radius:6px; border:1px solid transparent;
      background:var(--accent); color:#fff; cursor:pointer; font-size:13px;
      font-family:inherit; text-decoration:none; display:inline-block;
    }
    button:hover, .btn:hover { filter:brightness(1.12); }
    button:disabled, .btn[disabled], .btn.disabled { opacity:.55; cursor:not-allowed; filter:none; }
    .btn-ghost { background:var(--panel2); border-color:var(--line2); color:var(--fg); }
    .btn-ghost:hover { background:var(--panel3); filter:none; }
    /* Nguy hiem = VIEN, khong phai nen dac. Mot bang co sau hang thi sau nut
       do dac la sau lan mat nhin thay canh bao — den luc can canh bao that thi
       no khong con noi len duoc gi. Nen chi to len khi ro chuot. */
    .btn-danger { background:transparent; border-color:var(--err-line); color:var(--err); }
    .btn-danger:hover { background:var(--err-bg); filter:none; }
    .btn-sm { padding:5px 10px; font-size:12px; }

    .check { display:flex; align-items:center; gap:8px; color:var(--fg); }
    .check input { width:auto; }

    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; color:var(--dim); font-weight:500; padding:6px 8px 6px 0; font-size:11px;
         text-transform:uppercase; letter-spacing:.5px; }
    td { padding:8px 8px 8px 0; border-top:1px solid var(--line); }

    .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; }
    .badge-ok   { background:#0f2417; color:var(--ok);   border:1px solid #14532d; }
    .badge-warn { background:#2a2314; color:var(--warn); border:1px solid #7c5e10; }
    .badge-err  { background:#2a1416; color:var(--err);  border:1px solid #7f1d1d; }

    .alert { border-radius:10px; padding:12px 16px; margin-bottom:14px; border:1px solid; }
    .alert-ok   { background:#0f2417; border-color:#14532d; }
    .alert-warn { background:#2a2314; border-color:#7c5e10; }
    .alert-err  { background:#2a1416; border-color:#7f1d1d; }


    .muted { color:var(--muted); }
    .dim   { color:var(--dim); }
    .mono  { font-family:Consolas,monospace; }

    /* ── Khối mã ────────────────────────────────────────────────
       🔴 Trang hướng dẫn tồn tại để khách CHÉP cấu hình. Trước 25/08 `pre` không
          có nền, không viền, không lề — chữ trần nằm lẫn vào phần văn xuôi, và
          người đọc phải tự tô để chép. Với một trang tài liệu thì đó là hỏng
          đúng việc chính của nó. */
    pre { margin:0; background:var(--panel2); border:1px solid var(--line);
          border-radius:8px; padding:12px 14px; overflow-x:auto;
          color:#c3c9d4; font-size:12px; font-family:Consolas,monospace;
          /* ⚠️ `pre` chứ không phải `pre-wrap`: một dòng `base_url = "..."` bị
             bẻ giữa chừng là một dòng khách chép về sẽ sai. Thà cuộn ngang. */
          white-space:pre; word-break:normal; }
    pre code { font-family:inherit; font-size:inherit; color:inherit; }

    /* Bảng: có đường kẻ và nền tiêu đề thì mới quét mắt theo hàng được. */
    .table th { border-bottom:1px solid var(--line); }
    .table td, .table th { padding:8px 12px 8px 0; }

    /* 🔴 PHÓNG TO SÂU: bảng tự cuộn thay vì đẩy cả trang tràn ngang.
     *
     * Đo 06/09 ở khung nhìn CSS 195px (một máy 390px phóng 200%):
     *
     *     /gia-api    bang w=236  ->  scrollWidth 279, tran 84px
     *     /huong-dan  bang w=212  ->  scrollWidth 257, tran 62px
     *     15/15 bang do duoc: KHONG cai nao co to tien `overflow-x:auto`
     *
     * `.tablewrap` trong `ltt.css` giải đúng bài này, nhưng nó cần một thẻ bọc
     * trong HTML — mà `class="table"` xuất hiện ~45 lần trên 22 template. Sửa
     * ở đây là một chỗ thay cho 45 chỗ.
     *
     * ⚠️ Ngưỡng 320px là CỐ Ý, không phải một con số tròn: WCAG 1.4.10 đòi
     *    reflow ở 320px và nền tảng này ĐẠT ở đó (0/20 route tràn). Dưới 320px
     *    là vùng ngoài chuẩn, nơi một bảng cuộn được vẫn hơn một trang tràn.
     *    Đặt ngưỡng rộng hơn sẽ đổi hành vi trên điện thoại thật (390px) mà
     *    không được lợi gì — ở đó bảng đã vừa.
     *
     * ⭐ `display:block` vẫn giữ cột thẳng hàng: trình duyệt sinh hộp bảng ẩn
     *    danh cho các hàng bên trong. Đây là kỹ thuật `table-responsive` quen
     *    thuộc, áp thẳng lên bảng thay vì lên một thẻ bọc.
     */
    @media (max-width: 320px) {
      .table { display:block; overflow-x:auto; max-width:100%;
               overscroll-behavior-inline:contain; }
    }

    /* Nút sao chép, do `sao_chep.js` gắn vào. Không có JS thì không có nút —
       và trang vẫn đọc được bình thường. */
    .khoi-ma { position:relative; }
    .khoi-ma > .nut-chep {
      position:absolute; top:8px; right:8px; padding:4px 10px; font-size:11px;
      border:1px solid var(--line); border-radius:6px;
      background:var(--panel); color:var(--muted); cursor:pointer; opacity:0;
      transition:opacity .12s;
    }
    .khoi-ma:hover > .nut-chep, .khoi-ma > .nut-chep:focus-visible { opacity:1; }
    .khoi-ma > .nut-chep.xong { color:var(--ok); border-color:var(--ok); opacity:1; }
    @media (hover: none) { .khoi-ma > .nut-chep { opacity:1; } }
</style>
