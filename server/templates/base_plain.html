<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/ltt.css?v={{ asset_ver }}">
  <title>{% block title %}LTT AI Studio{% endblock %}</title>
  <style>
    * { box-sizing:border-box; }
    body {
      font-family:var(--font); margin:0; color:var(--fg); font-size:14px;
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
      background:radial-gradient(720px 380px at 50% -12%, #16223f, transparent 60%), var(--bg);
    }
    .logo .mark{width:46px; height:46px; border-radius:13px; font-size:17px; margin:0 auto 10px;}
    .box { width:100%; max-width:360px; }
    .logo { text-align:center; margin-bottom:22px; }
    .logo h1 { font-size:22px; margin:0; }
    .logo p  { color:var(--dim); margin:4px 0 0; font-size:12px; }
    .card {
      background:var(--panel); border:1px solid var(--line);
      border-radius:10px; padding:22px;
    }
    form { display:flex; flex-direction:column; gap:12px; }
    input {
      padding:10px; border-radius:6px; border:1px solid var(--line);
      background:var(--panel2); color:var(--fg); font-size:14px; width:100%;
    }
    input:focus { outline:1px solid var(--accent); }
    button {
      padding:10px; border-radius:6px; border:none; background:var(--accent);
      color:#fff; cursor:pointer; font-size:14px;
    }
    button:hover { filter:brightness(1.12); }
    .error { color:var(--err); font-size:13px; margin:0; }
    .hint { font-size:13px; margin:4px 0 0; text-align:center; }
    a { color:#7aa2f7; }
  </style>
</head>
<body>
  <div class="box">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
