<!DOCTYPE html>
<html lang="{{ lang_hien_tai() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/ltt.css?v={{ asset_ver }}">
  <title>{% block title %}LTT AI Studio{% endblock %}</title>
  <style>
    * { box-sizing:border-box; }
    body {
      font-family:var(--font); margin:0; color:var(--fg); font-size:14px;
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
      background:radial-gradient(720px 380px at 50% -12%, var(--brand-soft), transparent 60%), var(--bg);
    }
    .box { width:100%; max-width:420px; }
    .auth-home{display:grid;width:52px;height:52px;margin:0 auto 14px;place-items:center;
      border-radius:15px;text-decoration:none}
    .auth-home .mark{width:48px;height:48px;border-radius:14px;font-size:16px}
    .auth-brand{text-align:center;margin-bottom:20px}
    .auth-brand h1{font-size:24px;letter-spacing:-.35px;margin:5px 0 0}
    .auth-brand p{max-width:34ch;margin:7px auto 0;color:var(--muted);font-size:13px;line-height:1.5}
    .card {
      background:var(--panel); border:1px solid var(--line);
      border-radius:var(--radius); padding:24px;box-shadow:0 22px 60px #0009;
    }
    form { display:flex; flex-direction:column; gap:12px; }
    .auth-field{display:grid;gap:6px}
    .auth-field label{color:var(--text-secondary);font-size:12px;font-weight:600}
    .auth-field small{color:var(--dim);font-size:11px;line-height:1.45}
    input {min-height:44px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--line2);
      background:var(--panel2);color:var(--fg);font-size:14px;width:100%;font-family:inherit}
    input::placeholder{color:var(--dim)}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-shadow)}
    button {
      min-height:44px;padding:10px;border-radius:var(--radius-sm);border:1px solid transparent;
      /* Golden UI: nen phang `--brand-fill` (chu trang 4.84:1). Gradient cu tu
         #ef3731 xuong: phan tren chi 3.99:1, va axe KHONG do duoc gradient nen
         loi nay lot qua moi luot quet. */
      background:var(--brand-fill);
      color:#fff;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;
    }
    button:hover { background:var(--brand-fill-hover); }
    .error,.auth-state{padding:10px 12px;border:1px solid var(--err-line);border-radius:var(--radius-sm);
      background:var(--err-bg);color:var(--err);font-size:13px;line-height:1.5;margin:0 0 12px}
    .auth-state.success{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
    .auth-copy{color:var(--text-secondary);font-size:13px;line-height:1.6;margin:0}
    .hint{font-size:13px;line-height:1.6;margin:16px 0 0;text-align:center;color:var(--muted)}
    .auth-sep{padding:0 5px;color:var(--dim)}
    a { color:var(--accent2); }
    @media(max-width:480px){body{padding:16px}.card{padding:20px}.auth-brand h1{font-size:22px}}
  </style>
  {# hreflang (H24): khong co no Google coi hai ban la noi dung trung lap va tu
     chon mot ban — mat dung cai loi ich da danh doi khi chon tien to /en/. #}
  {%- set _p = request.scope.get('path', '/') %}
  <link rel="alternate" hreflang="vi" href="{{ request.base_url|string|trim('/') }}{{ _p }}">
  <link rel="alternate" hreflang="en" href="{{ request.base_url|string|trim('/') }}/en{{ '' if _p == '/' else _p }}">
  <link rel="alternate" hreflang="x-default" href="{{ request.base_url|string|trim('/') }}{{ _p }}">
</head>
<body>
  <main class="box">
    {% block content %}{% endblock %}
    {% include "_platform_footer.html" %}
  </main>
</body>
</html>
