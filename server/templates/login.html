{% extends "base_plain.html" %}
{% block title %}Đăng nhập — LTT AI Studio{% endblock %}
{% block content %}
  <div class="logo">
    <span class="mark">LTT</span>
    <h1>LTT AI Studio</h1>
    <p>Nền tảng công cụ AI — dùng theo credit</p>
  </div>
  <div class="card">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next|default('')|e }}">
      <input type="text" name="username" placeholder="Tên đăng nhập" required autofocus autocomplete="username">
      <input type="password" name="password" placeholder="Mật khẩu" required autocomplete="current-password">
      <button type="submit">Đăng nhập</button>
    </form>
    <p class="hint">
      <a href="/register">Tạo tài khoản</a> ·
      <a href="/forgot-password">Quên mật khẩu?</a>
    </p>
  </div>
{% endblock %}
