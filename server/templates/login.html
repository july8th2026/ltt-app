{% extends "base_plain.html" %}
{% block title %}Đăng nhập — LTT AI Studio{% endblock %}
{% block content %}
  <div class="logo">
    <h1>LTT AI Studio</h1>
    <p>Bảng điều khiển đăng bài Facebook &amp; TikTok</p>
  </div>
  <div class="card">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="text" name="username" placeholder="Tên đăng nhập" required autofocus autocomplete="username">
      <input type="password" name="password" placeholder="Mật khẩu" required autocomplete="current-password">
      <button type="submit">Đăng nhập</button>
    </form>
  </div>
{% endblock %}
