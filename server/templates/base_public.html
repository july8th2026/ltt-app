<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>{% block title %}LTT AI Studio{% endblock %}</title>
  <style>
    :root {
      --bg:#0f1115; --panel:#171a21; --panel2:#1b1f27; --line:#2a2e37;
      --fg:#e6e8eb; --muted:#9aa4b2; --dim:#6B7280;
      --accent:#3b6ef2; --accent2:#7aa2f7;
      --ok:#5bd67d; --warn:#f0b429; --err:#f26161;
    }
    * { box-sizing:border-box; }
    body { font-family:system-ui,"Segoe UI",sans-serif; margin:0;
           background:var(--bg); color:var(--fg); font-size:14px; }
    a { color:var(--accent2); text-decoration:none; }

    .topbar {
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:5;
    }
    .brand { font-weight:700; font-size:16px; }
    .brand small { color:var(--dim); font-weight:400; font-size:11px; margin-left:8px; }
    .authbtns { display:flex; gap:10px; align-items:center; }
    .btn { padding:8px 14px; border-radius:6px; border:none; background:var(--accent);
           color:#fff; cursor:pointer; font-size:13px; display:inline-block; }
    .btn:hover { filter:brightness(1.12); }
    .btn-ghost { background:var(--panel2); border:1px solid var(--line); color:var(--fg); }

    .wrap { max-width:1100px; margin:0 auto; padding:28px 24px 60px; }
    h1 { font-size:22px; margin:0 0 6px; }
    .page-sub { color:var(--muted); margin:0 0 22px; }

    .card { background:var(--panel); border:1px solid var(--line);
            border-radius:10px; padding:16px 18px; }
    .card-accent { height:3px; border-radius:3px 3px 0 0; margin:-16px -18px 14px; }
    .card h2 { font-size:15px; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
    .muted { color:var(--muted); } .dim { color:var(--dim); }
    .mono { font-family:Consolas,monospace; }
    .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; }
    .badge-warn { background:#2a2314; color:var(--warn); border:1px solid #7c5e10; }

    @media (max-width:820px){ .wrap{ padding:18px 16px; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">LTT AI Studio<small>Nền tảng công cụ AI — dùng theo credit</small></div>
    <div class="authbtns">
      <a class="btn-ghost btn" href="/login">Đăng nhập</a>
      <a class="btn" href="/register">Đăng ký</a>
    </div>
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
