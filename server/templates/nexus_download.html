{% extends "base_public.html" %}
{% import "_nexus_tai.html" as nxt with context %}
{% block title %}{{ _("Tải LTT Nexus") }}{% endblock %}
{% block content %}
{#
  Trang tải LTT Nexus.

  C3 17/09/2026: bỏ khối <style> riêng (màu hex dự phòng, nút giả "Đang chuẩn bị")
  — thẻ đi qua `_nexus_tai.html`, cùng component với lưới "Tải về" của `/nexus`;
  đầu trang cùng nhịp eyebrow · tiêu đề · lời dẫn của trang giới thiệu. Kiểu ở
  `ltt.css` (khối C3, `.nx-tai-*`). Mọi chữ qua `_()` — trước đây bản /en vẫn
  hiện tiếng Việt.
#}
<div class="nx-tai-trang">
  <header class="nx-tai-dau-trang">
    <span class="eyebrow">LTT Nexus</span>
    <h1>{{ _("Tải LTT Nexus") }}</h1>
    <p class="nx-tai-dan">{{ _("Điều khiển máy tính từ xa — an toàn, do LTT vận hành.") }}
      {{ _("Cài lên máy cần điều khiển từ xa, rồi cài lên máy hoặc điện thoại bạn đang ngồi.") }}</p>
    {% if version %}<span class="badge b-grey nx-tai-ban">{{ _("Phiên bản") }} {{ version }}</span>{% endif %}
  </header>

  <div class="nx-tai-luoi nx-tai-luoi--rong">
    {% for p in platforms %}
      {% call nxt.the(p, muc='h2') %}
        {% if p.key == 'ios' and p.signed %}
          {# Ky Ad Hoc/Enterprise roi thi Safari cai thang duoc qua itms-services.
             Chua ky thi KHONG hien nut nay: bam vao se khong co gi xay ra. #}
          <a class="btn nx-tai-nut" href="itms-services://?action=download-manifest&amp;url={{ request.base_url|string|trim('/') }}/nexus/ios-manifest.plist">
            {{ _("Cài lên iPhone") }}
          </a>
          <p class="nx-tai-ghi nx-tai-ghi--canh">{{ _("Mở trang này bằng Safari — trình duyệt khác sẽ không cài được.") }}</p>
        {% elif p.setup_url %}
          {# Co file cai MOT-FILE thi moi cai do TRUOC. Ban zip bat nguoi dung tu
             giai nen dung cho, va do cung la thu khong tu cap nhat sach duoc. #}
          <a class="btn nx-tai-nut" href="{{ p.setup_url }}" download>{{ _("Tải file cài") }}</a>
          <p class="nx-tai-sha">SHA-256: <code translate="no">{{ p.setup_sha256 }}</code></p>
          {# Chi moi ban ZIP khi no THAT SU la mot file khac (macOS dung cung mot
             `.dmg` cho ca hai). #}
          {% if p.url and p.url != p.setup_url %}
            <a class="nx-tai-phu" href="{{ p.url }}" download>{{ _("Hoặc tải bản zip chạy-không-cài") }}</a>
            {% if p.sha256 %}<p class="nx-tai-sha">SHA-256 (zip): <code translate="no">{{ p.sha256 }}</code></p>{% endif %}
          {% endif %}
        {% else %}
          <a class="btn nx-tai-nut" href="{{ p.url }}"{% if p.kind != 'appstore' %} download{% endif %}>
            {% if p.kind == 'appstore' %}{{ _("Mở App Store") }}{% else %}{{ _("Tải xuống") }}{% endif %}
          </a>
          {% if p.sha256 %}<p class="nx-tai-sha">SHA-256: <code translate="no">{{ p.sha256 }}</code></p>{% endif %}
        {% endif %}
      {% endcall %}
    {% endfor %}
  </div>

  <section class="nx-tai-huong-dan" aria-labelledby="nx-tai-an-toan">
    <h2 id="nx-tai-an-toan">{{ _("Cài đặt & an toàn") }}</h2>
    <ol>
      <li>{{ _("Sau khi tải, đối chiếu SHA-256 (ghi ở mỗi nền tảng) với file bạn tải — khớp mới chạy.") }}</li>
      <li>{{ _("Windows có thể hiện cảnh báo SmartScreen (bản chưa ký): bấm More info → Run anyway, chỉ khi hash đúng.") }}</li>
      <li>{{ _("Mở app, đăng nhập tài khoản LTT. Máy sẽ gắn vào tài khoản của bạn.") }}</li>
      <li>{{ _("Muốn điều khiển máy khi vắng người: bấm Install trong app (nâng quyền một lần).") }}</li>
    </ol>
    <p class="nx-tai-ghi">{{ _("LTT Nexus dựa trên RustDesk (AGPL-3.0); mã nguồn bản sửa được công bố công khai.") }}</p>
  </section>
</div>
{% endblock %}
