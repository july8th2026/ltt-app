# llama-swap.yaml - vong doi model VLM tren MAY B. (H38, phase P6)
#
# Tep nay THUAN ASCII (quy tac 2 cua CLAUDE.md) - no duoc doc boi mot binary Go,
# nhung no nam canh cac .ps1 va bi chep di chep lai bang cung mot duong ong.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# ==========================================================================
# HAI HO SO, MOT TRONG SO. Vi sao khong phai mot ho so duy nhat:
#
#   mmproj ton 0,86 GiB thuong tru. O moc ngu canh 200K tren card 24 GB, 0,86 GiB
#   do la HAI PHAN BA bien an toan con lai. Nen thay vi hy sinh mot trong hai,
#   ta khai hai ho so va de llama-swap doi giua chung theo ten model client goi.
#   Chi MOT cai nam trong VRAM tai mot thoi diem.
#
#     qwen38-api      200K ngu canh, KV q4_0, KHONG vision  ~21,5 GB  <- MAC DINH
#     qwen38-vision   131K ngu canh, KV q4_0, CO  vision    ~21,1 GB
#
# ==========================================================================
# CAC CON SO DUOI DAY DA DUOC DO, 03/09/2026, TREN DUNG CARD DANG PHUC VU.
#
# !! Ban truoc cua muc nay ghi "MOI CON SO TREN LA MOC KHOI DIEM, CHUA PHAI SO
#    TA DO" va lay tu mot sweep cong dong. Cau do dung khi viet va da HET DUNG.
#    Nay thay bang so do that (build 10689, prompt ngau nhien moi luot nen khong
#    tai dung prompt cache, dem token bang /tokenize cua chinh model dang nap):
#
#   -c 204800        nap duoc, VRAM sau nap 21.959 MiB / 24.576.
#                    Chay that toi 179.902 token vao, doc lai dung moc dau VA
#                    moc cuoi prompt. KHONG dat 262144 (cong dong: "262K
#                    exceeded 24 GB at model load").
#   --cache-type-* q4_0
#                    BAT BUOC o 200K: q8_0 o 204800 khong vua card 24 GB.
#                    VRAM dinh 21.979 MiB - THAP HON ho so 131K/q8_0 cu
#                    (22.017 MiB), vi KV q4_0 o 204.800 nho hon KV q8_0 o
#                    131.072. Chat luong: 36/36 bo danh_gia_llm va 10/10
#                    kim-trong-dong-co o 130K (nam do sau) - hoa voi q8_0,
#                    nhung hoa O KICH TRAN nen chi loai tru suy giam DU LON
#                    DE DO THAY.
#   --spec-draft-n-max 2
#                    Card 24 GB dat dinh o n-max 2. Sau hon thi code nhanh len
#                    nhung prose cham di, tong the giam. (Van la so cong dong.)
#
#   Prefill do duoc:  50K 999,9 tok/s | 100K 805,3 | 130K 726,5
#                    150K 672,4 | 165K 639,1 | 180K 616,7
#
#   Bang chung day du: docs/VLM_NOI_BO/NGU_CANH_DAI_2026-09-03.md
#
# ==========================================================================
# GPU CHUA SACH LUC NAP - DO THAT NGAY 22/08/2026 (P6). DOC KY MUC NAY.
#
# !! DINH CHINH: ban truoc cua tep nay viet rang "llama.cpp BAO LOI TO khi GPU
#    chua sach, khac vLLM". SAI. So do bac bo no:
#
#      card BAN  (ComfyUI con giu 6.211 MiB)  ->  18,2 tok/s   VRAM 24.102/24.576
#      card SACH (sau khi goi /free)          ->  63,3 tok/s   VRAM 20.236/24.576
#
#    Chenh 3,5 LAN. llama.cpp KHONG bao mot loi nao: no nhet vua roi TRAN trong so
#    sang RAM chu qua PCIe. /health van xanh, /v1/models van dung, noi dung sinh ra
#    van hop le. Chi co toc do lang le con mot phan tu.
#
#    Dung luat 7 cua cong dong: "A shared desktop halves everything, silently -
#    spilled 3.5 GB of weights to host RAM over PCIe while /health stayed green."
#
# !! VA: ComfyUI GIU MODEL THUONG TRU KE CA SAU KHI RENDER XONG. Sau mot luot ve
#    no van om 6.211 MiB. Chi POST /free voi unload_models moi dua ve 1.515 MiB.
#    Nen "doi ComfyUI ranh" la KHONG DU - phai bao no nha, roi TU DI DO LAI.
#
#   => Viec do thuoc tang tren: `llm_gateway/don_dep.py` goi /free cua ComfyUI roi
#      cho `nvidia-smi` xac nhan VRAM <= 2.500 MiB, TRUOC khi de yeu cau di tiep.
#      Chua sach thi cong tra 429, KHONG nap de.
#      Khong lam bang wrapper .cmd o day - llama-swap quan ly tien trinh no sinh
#      ra, boc them mot lop la moi mo coi tien trinh.
# ==========================================================================

healthCheckTimeout: 600      # nap GGUF 15,33 GiB: vai giay tu page cache, lau hon tu dia lanh
logLevel: info
logToStdout: "both"

startPort: 8281

macros:
  BIN: "H:/LTT_LLM/bin/llamacpp"
  MODELS: "H:/LTT_LLM/models"
  GGUF: "H:/LTT_LLM/models/Qwen3.8-27B-UD-Q4_K_M.gguf"
  # -fa 1        flash attention
  # -ngl 999     day het lop len GPU
  # --jinja      BAT BUOC. Thieu no thi model "khong co moc nao de biet luot cua
  #              ban ket thuc o dau" - lan man qua stop token, hoac tra loi cut.
  # --parallel 1 speculative decoding la toi uu MOT LUONG. Loi the bien mat o
  #              --parallel 4, va mot baseline --parallel 2 doc thap ~20%.
  #
  # !! HAI CO DUOI DAY LA BAT BUOC CHO CODEX VA CLAUDE CODE, khong phai tuy chon.
  #
  # --chat-template-file
  #   Template CHINH THUC cua Qwen3.8 CO REGRESSION lam hong tool calling:
  #     - crash khi enable_thinking=false
  #     - "tool argument crashes on JSON strings from standard OpenAI API clients"
  #       <- day dung la thu Codex gui
  #     - hardcode xhigh nen dot het ngan sach token vao reasoning
  #     - "empty think poisoning" chen <think></think> rong vao lich su
  #     - agentic stalling giua vong tool-call
  #   Ban va cong dong: froggeric/Qwen-Fixed-Chat-Templates (qwen3.8-froggeric-v22.3),
  #   mac dinh reasoning_effort = medium thay vi xhigh.
  #
  # --reasoning-format deepseek
  #   Tach khoi <think> ra truong `reasoning_content` rieng, de token suy nghi
  #   KHONG chen vao giua mot tool call. Hang 3090 nhanh nhat trong sweep cong dong
  #   (b10450, 63,5 tok/s) dung dung hai co nay.
  #
  # !! DANH DOI PHAI BIET: reasoning_effort medium re hon xhigh nhung diem IFBench
  #    78,3 cua cong dong do o xhigh. P3 phai do CA HAI muc roi moi chot.
  # --metrics    MO CUA DOC /metrics cua llama-server (Prometheus).
  #
  #   !! CO NAY KHONG BAT VIEC DEM. Viec dem CHAY SAN, vo dieu kien, trong vong
  #      lap suy luan — doi chieu ma nguon llama.cpp (tools/server):
  #
  #        server-context.cpp:4066   metrics.add_prompt(...)
  #        server-context.cpp:4072   metrics.n_decode++
  #        server-context.cpp:3412   metrics.add_prompt_cached(n_past)
  #        server-context.cpp:4129   metrics_on_prediction(slot)
  #
  #      Con co nay chi gac CUA DOC:
  #
  #        server-context.cpp:4669   if (!params.endpoint_metrics) { ... }
  #
  #   => Truoc dong nay, may B DEM ROI VUT DI. Bat len ton 0 tren duong nong:
  #      khong them mot phep tinh nao, chi them mot endpoint chi-doc tren
  #      127.0.0.1:8281 — noi chi llama-swap voi toi duoc.
  #
  #   Thu mo khoa duoc, ma khong cach nao khac lay duoc:
  #     * token prompt/sinh ra, prefill & decode tok/s
  #     * KV cache, slot dang ban
  #     * llamacpp:spec_decode_num_accepted_tokens_per_pos_total
  #       <- TI LE CHAP NHAN SUY DOAN. `--spec-type draft-mtp` o duoi dang bat,
  #          nen day la cach duy nhat biet no co dang giup gi khong.
  #
  #   ! Cong 8299 KHONG phoi /metrics ra ngoai. Muon xem thi hoi qua llama-swap
  #     tren loopback cua may B. Cong chi phoi so cua RIENG no (`/health` ->
  #     `dem`), vi do la thu llama-server khong bao gio nhin thay: moi luot bi
  #     TU CHOI deu khong cham toi engine.
  CHUNG: >-
    --jinja
    --chat-template-file H:/LTT_LLM/models/chat_template.jinja
    --reasoning-format deepseek
    -fa 1 -ngl 999 --parallel 1
    --spec-type draft-mtp --spec-draft-n-max 2
    --metrics

models:
  # ============================================================ GHIM GPU (P0)
  # !! MAY B CO HAI GPU TU 09/2026: `llama-server --list-devices` in
  #      CUDA0: RTX 3090 (24.575 MiB)   CUDA1: RTX 5060 Ti (16.310 MiB)
  #    Voi `-ngl 999` va KHONG ghim, llama.cpp mac dinh CHIA LOP qua MOI thiet bi
  #    no thay => model 27B tu chia sang ca 5060 Ti (cham hon, va trai quyet dinh
  #    cua chu du an: Qwen CHI chay 3090, 5060 Ti de danh model khac - D-09a,
  #    `docs/multijob/DECISION_LOG.md`).
  #
  #    Ghim bang UUID, KHONG bang chi so: thu tu liet ke CUDA doi duoc (lap them
  #    card, doi khe) con UUID thi khong. Dat O DAY chu khong o env cua dich vu
  #    `LTTLlamaSwap`: `cai_dat_dich_vu.ps1` co nhanh go-cai-lai dich vu, va env
  #    dich vu mat AM THAM o lan do. `tests/test_950` doi moi ho so co dong nay.
  # ==========================================================================

  # ============================================================ KHACH NGOAI
  # Ho so MAC DINH, phuc vu khach goi API qua Cloudflare. Chot 2026-08-27.
  #
  # Engine 200K (`-c 204800`). Tran vao public 169.984, cong bo cho client
  # 156.385 - ba con so cho ba viec, va chung KHONG duoc gop lai.
  #   Nguon chan ly: `apps/ltt_llm/ngan_sach.py`. `test_334` doi chieu `-c` o
  #   day voi `CUA_SO_MODEL` va do khi hai ben lech.
  #
  # !! MUC NAY TUNG NOI "Public input cap 65K theo Q116" VA "131K chi danh cho
  #    engine". Ca hai da het dung tu 03/09. Tran vao khong con la mot con so
  #    chon tay cho "bien an toan Cloudflare" - no la mot con so DAN XUAT
  #    (cua so - token ra toi da - le uoc), va rang buoc Cloudflare duoc cuong
  #    che o mot cho khac han: cua DONG BO tu tu choi theo NGAN SACH THOI GIAN
  #    (`features.tran_token_ra_dong_bo`), nen no co lai dung ma khong can mot
  #    tran token rieng.
  #
  # !! VA CAU "Chua ai chung minh 200K DUOC DO DAY tren card 24 GB" - nay DA CO.
  #    Do 03/09 tren chinh card nay: chay that toi 179.902 token vao, doc lai
  #    dung moc dau va moc cuoi prompt, VRAM dinh 21.979 MiB. Cot "ngu canh"
  #    trong bang cong dong van la con so CAP PHAT (do voi prompt 400 token) -
  #    canh bao do dung, va no khong con ap cho ta.
  #
  # MOT HO SO CHO MOI LOAI VIEC (coding, chat, agent, tom tat). Khong tach model
  # theo tac vu: chung deu la "text vao, text ra, co tool" - cung mot hinh dang.
  # Khach dieu khien do sau bang `reasoning_effort` trong tung request.
  qwen38-api:
    name: "Qwen3.8-27B (LTT Studios)"
    description: "Coding, chat, agent, tom tat. Engine 200K; input public 170K."
    capabilities:
      in: ["text"]
      out: ["text"]
    cmd: |
      ${BIN}/llama-server.exe
      -m ${GGUF}
      ${CHUNG}
      -c 204800
      --cache-type-k q4_0 --cache-type-v q4_0
      --host 127.0.0.1 --port ${PORT}
    env:
      - "CUDA_VISIBLE_DEVICES=GPU-26623278-4fa5-82db-4306-237651b03e78"
    proxy: "http://127.0.0.1:${PORT}"
    # Dai hon `ops`: khach ngoai goi rai rac, nap lai giua cac lan la tra tien
    # bang do tre cho nguoi dung cuoi.
    ttl: 1800
    unloadTimeout: 30

  # ==========================================================================
  # `qwen38-ops` DA GO NGAY 03/09, va viec go la MOT PHAN CUA BAN VA.
  #
  # No tung ton tai vi ta tin rang 200K "chi dung duoc khi KHONG qua
  # Cloudflare". Do la mot suy luan, khong phai mot phep do, va no SAI cho cua
  # ma Codex/Claude Code that su dung:
  #
  #   * lap luan cu: prefill ~1.000 tok/s => prompt 200K ton ~200s => CF cat o
  #     125s => 524. Dung cho cua DONG BO.
  #   * nhung `nhip_tim.py` chen chu thich SSE moi 15 giay TRONG LUC prefill,
  #     nen dong ho im-lang cua CF khong bao gio cham o cua STREAM. Chu thich
  #     cu duoc viet TRUOC khi `nhip_tim.py` ton tai, va khong ai doc lai no.
  #
  # !! VA CO MOT LY DO MANH HON DE CHI GIU MOT HO SO TEXT. Do that 03/09:
  #    llama-swap **giet mot luot dang chay** de nap ho so khac. Luot bi giet
  #    chi nhan `ConnectionReset`, khong loi nao noi vi sao - no trong y het
  #    mot lan OOM, va no da lam hong hai lo do lien tiep cua chinh phien nay.
  #
  #    Hai ho so text cung mo ra cho khach = mot nguon `ConnectionReset` ngau
  #    nhien khong giai thich duoc. Mot ho so text cong khai, mot tep `-c`, mot
  #    su that. Nen `qwen38-api` GIO CHINH LA ho so 200K.
  # ==========================================================================

  # ------------------------------------------------------------------- vision
  qwen38-vision:
    name: "Qwen3.8-27B vision (131K, doc anh)"
    description: "Doc anh chup man hinh, bieu do, giao dien. Ngu canh 131K."
    capabilities:
      in: ["text", "image"]
      out: ["text"]
    cmd: |
      ${BIN}/llama-server.exe
      -m ${GGUF}
      --mmproj ${MODELS}/mmproj-F16.gguf
      ${CHUNG}
      -c 131072
      --cache-type-k q4_0 --cache-type-v q4_0
      --host 127.0.0.1 --port ${PORT}
    env:
      - "CUDA_VISIBLE_DEVICES=GPU-26623278-4fa5-82db-4306-237651b03e78"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600
    unloadTimeout: 30

# KHONG khai `groups` cho hai ho so nay. Mac dinh cua llama-swap la chay MOT model
# mot luc, va do chinh la dieu ta muon: hai ho so nay dung chung mot card 24 GB va
# cong lai la 43 GB. Mot dong `groups` dat sai cho o day la mot lan OOM chac chan.
