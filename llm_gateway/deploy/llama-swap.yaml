  # !! CAI GIA, noi cho dung: KHONG phai "anh nho dat len 12,5x". Anh duoi 1024
  #    token HIEN DANG KHONG DUNG DUOC (9/20). Ta khong lam thu dang chay dat len
  #    - ta lam thu dang HONG chay duoc. Anh tu ~1 Mpx tro len (anh chup man hinh
  #    1080p va lon hon) GIU NGUYEN chi phi.
  #
  # !! Ai doi hai so nay phai doi luon hang o `llm_gateway/anh_token.py`, va
  #    `tests/test_4204_co_anh_khai_tuong_minh.py` doc nguoc chinh tep nay de bat
  #    khop. Do dung la ly do chung duoc khai o day thay vi nam ngam.
  CHUNG: >-
    --jinja
    --reasoning-format deepseek
    -fa 1 -ngl 999 -kvu
    --top-p 0.95 --top-k 20 --min-p 0
    --image-min-tokens 512 --image-max-tokens 4096
    --video-ffmpeg-dir ${FFMPEG}
    --metrics

models:
  # ============================================================ GHIM GPU (P0)
  # !! MAY B CO HAI GPU TU 09/2026: `llama-server --list-devices` in
  #      CUDA0: RTX 3090 (24.575 MiB)   CUDA1: RTX 5060 Ti (16.310 MiB)
  #    Voi `-ngl 999` va KHONG ghim, llama.cpp mac dinh CHIA LOP qua MOI thiet bi
  #    no thay => model 27B tu chia sang ca 5060 Ti (cham hon, va trai quyet dinh
  #    cua chu du an: Qwen3.8 CHI chay 3090, 5060 Ti danh cho Qwen3.5 - D-09a,
  #    `docs/multijob/DECISION_LOG.md`).
  #
  #    Tu khi co HAI model, ghim con lam mot viec thu hai va quan trong hon: no
  #    la thu GIU HAI MODEL TREN HAI CARD KHAC NHAU. Khong ghim thi ca hai deu
  #    thay ca hai card, va `groups: swap: false` o duoi se cho chung cung song
  #    tren CUNG mot card - dung mot lan OOM ma chu thich cu canh bao.
  #
  #    Ghim bang UUID, KHONG bang chi so: thu tu liet ke CUDA doi duoc (lap them
  #    card, doi khe) con UUID thi khong. Nguon danh tinh la
  #    `llm_gateway/deploy/gpu_may_b.json` (vai -> UUID), dat O DAY chu khong o
  #    env cua dich vu `LTTLlamaSwap`: `cai_dat_dich_vu.ps1` co nhanh go-cai-lai
  #    dich vu, va env dich vu mat AM THAM o lan do.
  #    `tests/test_1200` doi moi ho so ghim dung UUID theo vai.
  # ==========================================================================

  # ---------------------------------------------------- LTT-3.8 (RTX 3090)
  # Ho so MAC DINH, phuc vu khach goi API qua Cloudflare.
  #
  # Engine 221.184. Tran vao public va so cong bo cho client la hai con so KHAC,
  # va chung KHONG duoc gop lai: chung DAN XUAT tu con so nay (cua so - token ra
  # toi da - le uoc). Nguon chan ly: `apps/ltt_llm/ngan_sach.py`; `test_334` doi
  # chieu `-c` o day voi `CUA_SO_THEO_MODEL` va do khi hai ben lech.
  #
  # !! MUC NAY TUNG NOI "Public input cap 65K theo Q116" VA "131K chi danh cho
  #    engine". Ca hai het dung tu 03/09: rang buoc Cloudflare duoc cuong che o
  #    mot cho khac han - cua DONG BO tu tu choi theo NGAN SACH THOI GIAN
  #    (`features.tran_token_ra_dong_bo`), nen no co lai dung ma khong can mot
  #    tran token rieng o day.
  #
  # MOT HO SO CHO MOI LOAI VIEC (coding, chat, agent, tom tat, VA doc anh).
  # Khong tach model theo tac vu: chung deu la "text/anh vao, text ra, co tool" -
  # cung mot hinh dang. Khach dieu khien do sau bang `reasoning_effort`.
  #
  # --mmproj: tren GPU, ton ~1.136 MiB (G1b). `--no-mmproj-offload` lam vision
  #   ton DUNG 0 MiB VRAM (do: ba cap dong trung khit tung MiB, G1) nhung day ma
  #   hoa anh sang CPU - chu du an chot giu mmproj tren GPU (L-14) va tra gia
  #   bang ngu canh, khong bang do tre anh. 1 anh 1024x768 = 770 token (G4).
  #
  # --chat-template-file: BAT BUOC cho Codex va Claude Code, khong phai tuy chon.
  #   Template CHINH THUC cua Qwen3.8 CO REGRESSION lam hong tool calling:
  #     - crash khi enable_thinking=false
  #     - "tool argument crashes on JSON strings from standard OpenAI API clients"
  #       <- day dung la thu Codex gui
  #     - hardcode xhigh nen dot het ngan sach token vao reasoning
  #     - "empty think poisoning" chen <think></think> rong vao lich su
  #     - agentic stalling giua vong tool-call
  #   Ban va cong dong: froggeric/Qwen-Fixed-Chat-Templates v22.5. Tep duoc
  #   vendor trong repo va deploy theo hash; khong con phu thuoc tep sua tay
  #   tren may B. Q131 dat server default xhigh dung ba muc chinh thuc cua 3.8.
  #
  # `-b 512 -ub 512` (chi 3.8, cua so bao tri 18/09; `-ub` 512 von la mac dinh,
  #   nen thay doi that la `-b` 2048 -> 512). Do qua production, prefill 32K chen
  #   canh mot luot dang sinh chu (`KET_QUA_BAO_TRI_18_09.md`):
  #     luot dang sinh trong prefill : 1,4 -> 4,4 tok/s ; lang max 2,08 -> 0,75 s
  #     prefill 32K cua engine       : 31,13 -> 35,02 s (+12,5 %, duoi nguong 15 %)
  #   ! Gia phai tra: tong 3 luong 125,3 -> 105,0 tok/s (1 lan do, nhieu nhieu) -
  #     do lai truoc khi mo rong sang 3.5.
  # `--spec-type` dat o TUNG ho so chu khong o macro `CHUNG`: kha nang chay MTP
  # la thuoc tinh cua TEP GGUF (tep lmstudio khong co tensor MTP - G3b), khong
  # phai cua may. De o macro thi ho so thu ba them vao sau se thua huong mot co
  # ma tep cua no co the khong do noi.
  qwen38-api:
    name: "LTT-3.8"
    description: "Qwen3.8-27B. Coding, chat, agent, tom tat, doc anh. Ngu canh 221K."
    capabilities:
      in: ["text", "image"]
      out: ["text"]
    cmd: |
      ${BIN}/llama-server.exe
      -m ${GGUF38}
      --mmproj ${MODELS}/mmproj-F16.gguf
      --chat-template-file ${MODELS}/chat_template_v22.5.jinja
      ${CHUNG}
      --reasoning-effort xhigh
      --reasoning-budget 4096
      --reasoning-budget-message "Considering the limited time by the user, I have to give the solution based on the thinking directly now.
      "
      --temp 1.0
      -c 221184
      -np 3
      -b 512 -ub 512
      --cache-type-k q4_0 --cache-type-v q4_0
      --cache-ram 24576
      --ctx-checkpoints 8
      --spec-type draft-mtp --spec-draft-n-max 2
      --host 127.0.0.1 --port ${PORT}
    env:
      - "CUDA_VISIBLE_DEVICES=GPU-26623278-4fa5-82db-4306-237651b03e78"
    proxy: "http://127.0.0.1:${PORT}"
    # ------------------------------------------------------- dong ho nha
    # !! MOT nguon cho MOI model, cuong che bang cu phap YAML chu khong bang
    #    tri nho. `&ttl_nha` dinh nghia o day, `*ttl_nha` dung lai o ho so duoi;
    #    YAML giai chung TRUOC khi llama-swap nhin thay, nen engine chi thay mot
    #    so nguyen - khong phu thuoc vao viec macro co duoc thay trong truong so
    #    hay khong.
    #
    # !! KHONG go lai con so nay o ho so khac. Ngay 12/09 ca hai ho so mang
    #    `ttl: 0` go tay; sua mot cho quen cho kia la mot card khong bao gio nha.
    #    Model them sau nay chi viec viet `ttl: *ttl_nha`.
    #
    # 1800 = 30 phut (chu san pham chot 13/09/2026). Gia moi lan nha, do that
    # 13/09: qwen35-api ~10,5 s ; qwen38-api ~19,4 s.
    ttl: &ttl_nha 1800
    concurrencyLimit: 8
    unloadTimeout: 30

  # ---------------------------------------------------- LTT-3.5 (RTX 5060 Ti)
  # Model thu hai, ban tu dual-model pha 3. Card 16.311 MiB, nen no CO cho cho
  # ca `-c 262144` VA draft-mtp (G3, G3b) - khong phai nho may man: model 9B
  # chi ton ~7,3 GiB trong so so voi ~15,3 GiB cua 27B, nen du card nho hon 8 GB
  # thi phan con lai cho KV van rong hon.
  #
  # KV q8_0 (khong phai q4_0 nhu 3.8): card nay con bien 2,8 GiB truoc MTP, nen
  # khong phai doi chat luong KV lay cho. 3.8 thi BAT BUOC q4_0 o 221K.
  #
  # !! DOI 13/09/2026 - ho so nay NAY DUNG `--chat-template-file` (v22.5).
  #
  #    Chu thich cu o day viet: *"KHONG `--chat-template-file`: dung khuon dung
  #    san trong GGUF. Ban va froggeric la ban va cho template cua Qwen3.8; ap no
  #    cho 3.5 la ap mot ban va cho mot loi CHUA DUOC DO o model nay."*
  #
  #    Cau do **dung luc no duoc viet**. Dieu kien no dat ra - *"chua duoc do"* -
  #    da thoa ngay 13/09. Do qua duong that, 5 luot moi muc:
  #
  #        max_tokens   150   200   250   300   350   400   450+
  #        rong / luot  5/5   5/5   5/5   3/5   1/5   1/5   0/8
  #        token_ra     = DUNG BANG max_tokens, finish_reason=length
  #
  #    Tuc model tieu HET tran vao suy nghi roi bi cat truoc khi tra loi (L-02).
  #
  # !! Va phep do PHAN BIET, thu chi ra dich danh template:
  #
  #        ltt-3.5  reasoning_effort = None / low / xhigh -> token_ra 250/250/250, RONG ca ba
  #        ltt-3.8  cung ba gia tri                       -> token_ra  63/ 63/ 62, dung ca ba
  #
  #    Tham so cua khach KHONG doi duoc gi o 3.5 => co thu khac dang ghi de no.
  #    Khac biet duy nhat giua hai ho so luc ay: 3.8 dung template froggeric,
  #    3.5 dung template CHINH THUC trong GGUF.
  #
  # [nguon] `froggeric/Qwen-Fixed-Chat-Templates` mo ta dung loi nay, tung chu:
  #    *"Official `xhigh` default burns token budgets with zero content
  #    returned"* -> ban va mac dinh `medium`, them `none`/`off` de tat han.
  #    Va README v22.5 khai ro: *"universal drop-in ... the single
  #    `chat_template.jinja` file ... for all Qwen 3.5, 3.6, 3.8"*.
  #
  # !! Q131: ca hai ho so dung cung ban va v22.5 DA co tren may B. Tep nay duoc
  #    vendor + deploy tu repo, sha256:
  #    e57684bae4156211a55473c5a63be976a405a37ab5be5ae0e5abf1df5349c4b2.
  #    Qwen3.5 khong co enum effort chinh thuc; `--reasoning on` giu thinking
  #    bat dung model card, con budget 2048 la tran van hanh cua LTT.
  #
  # LTT-3.5 nhanh HON LTT-3.8 (76,21 so 63,01 tok/s) du card yeu hon, vi giai ma
  # bi chan boi bang thong bo nho: 7,3 GB trong so/token so voi 16,5 GB. (G3b)
  # -b 1024 (lan B 18/09, KET_QUA_BUB_E3_R17_18_09.md): luong nho canh prefill 32K khung
  # 1,23 -> 0,67 s, 2,4 -> 4,1 tok/s; prefill 32K khi co nguoi sinh +4 %. -ub mac dinh 512.
  qwen35-api:
    name: "LTT-3.5"
    description: "Qwen3.5-9B. Nhanh, re, doc anh. Ngu canh 262K."
    capabilities:
      in: ["text", "image"]
      out: ["text"]
    cmd: |
      ${BIN}/llama-server.exe
      -m ${GGUF35}
      --mmproj ${MODELS}/mmproj-9B-F16-unsloth.gguf
      --chat-template-file ${MODELS}/chat_template_v22.5.jinja
      ${CHUNG}
      --reasoning on
      --reasoning-budget 2048
      --reasoning-budget-message "Considering the limited time by the user, I have to give the solution based on the thinking directly now.
      "
      --temp 1.0
      -c 262144
      -np 4
      -b 1024
      --cache-type-k q8_0 --cache-type-v q8_0
      --cache-ram 24576
      --ctx-checkpoints 8
      --spec-type draft-mtp --spec-draft-n-max 2
      --host 127.0.0.1 --port ${PORT}
    env:
      - "CUDA_VISIBLE_DEVICES=GPU-ebecd0a4-a8a7-14a5-dad1-21565f6dc1df"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: *ttl_nha
    concurrencyLimit: 8
    unloadTimeout: 30

# ==========================================================================
# `qwen38-ops` DA GO NGAY 03/09, va viec go la MOT PHAN CUA BAN VA.
#
# No tung ton tai vi ta tin rang 200K "chi dung duoc khi KHONG qua Cloudflare".
# Do la mot suy luan, khong phai mot phep do, va no SAI cho cua ma Codex/Claude
# Code that su dung:
#
#   * lap luan cu: prefill ~1.000 tok/s => prompt 200K ton ~200s => CF cat o
#     125s => 524. Dung cho cua DONG BO.
#   * nhung `nhip_tim.py` chen chu thich SSE moi 15 giay TRONG LUC prefill, nen
#     dong ho im-lang cua CF khong bao gio cham o cua STREAM. Chu thich cu duoc
#     viet TRUOC khi `nhip_tim.py` ton tai, va khong ai doc lai no.
#
# !! VA LY DO MANH HON DE CHI GIU MOT HO SO CHO MOI MODEL. Do that 03/09:
#    llama-swap **giet mot luot dang chay** de nap ho so khac. Luot bi giet chi
#    nhan `ConnectionReset`, khong loi nao noi vi sao - no trong y het mot lan
#    OOM, va no da lam hong hai lo do lien tiep. (`tests/test_636` giu dieu nay)
#
#    Hai ho so CUNG MOT MODEL cung mo ra cho khach = mot nguon `ConnectionReset`
#    ngau nhien khong giai thich duoc. Mot ho so cho mot model, mot tep `-c`,
#    mot su that.
#
#    ! Va day chinh la ly do khoi `groups` duoi day PHAI co `swap: false`:
#       hai ho so duoi la hai MODEL khac nhau tren hai CARD khac nhau, khong
#       phai hai bien the cua mot model - de mac dinh (`swap: true`) thi moi lan
#       khach doi model la mot luot cua khach khac bi giet.
# ==========================================================================

# ==========================================================================
# GROUPS - CO NAO LAM NEN "CUNG LUC", va vi sao chinh no.
#
# Mac dinh cua llama-swap: model nao khong khai nhom nam trong nhom an
# `(default)` voi `swap: true` - tuc nap model thu hai thi model thu nhat bi
# TAT. Do la hanh vi DUNG cho ban truoc (hai ho so mot card 24 GB) va hanh vi
# SAI o day.
#
#   * `swap: false`  => thanh vien trong nhom KHONG day nhau ra. Day la co DUY
#     NHAT lam nen tinh "cung luc". Thieu no thi `ttl: 0` va `preload` deu vo
#     nghia: preload nap `qwen38-api` roi nap `qwen35-api`, va buoc thu hai TAT
#     buoc thu nhat - `/running` chi con mot model, khong mot loi nao.
#   * `exclusive: true` => khi nhom nay hoat dong thi moi nhom KHAC bi nha. Hom
#     nay khong co nhom nao khac nen tac dung la 0; giu lai vi no la HANG RAO cho
#     ngay ai do them mot ho so tham do ngoai nhom (vd `qwen38-thu`): ho so do
#     se bi nha, thay vi cong them ~16 GiB vao mot card chi con 445 MiB bien.
#   * KHONG khai `persistent`: no la co de mot nhom song sot qua `exclusive` cua
#     nhom KHAC, va chi co mot nhom thi no khong do duoc gi. Mot co khong ai do
#     la mot bien khong ai giai thich duoc lan sau.
#
# !! AN TOAN CUA `swap: false` KHONG DEN TU DONG NAY. No den tu hai dong
#    `CUDA_VISIBLE_DEVICES` o tren: hai model thuong tru la an toan CHI VI chung
#    o hai card khac nhau. Go mot dong ghim UUID roi de nguyen khoi nay lai la
#    dung mot lan OOM ma chu thich cu canh bao ("hai ho so cong lai 43 GB").
#    `tests/test_637` va `tests/test_1215` do dung cap dieu kien do: trong mot
#    nhom `swap: false`, khong hai thanh vien nao ghim CUNG mot UUID.
#
# !! DINH CHINH chu thich cuoi cua ban truoc: "KHONG khai `groups` cho hai ho so
#    nay ... Mot dong `groups` dat sai cho o day la mot lan OOM chac chan", va
#    `tests/test_637::test_khong_khai_groups` tung cuong che dung cau do. Cau do
#    dung khi hai ho so la hai bien the 27B tren MOT card. No het dung khi model
#    thu hai nam tren card KHAC: 13.481 MiB tren 16.311 MiB, bien 1.002 MiB sau
#    MTP (G3, G3b). Phep kiem da duoc viet lai de do dieu no THUC SU muon
#    (khong hai thanh vien cung mot UUID) chu khong phai bi xoa.
# ==========================================================================

groups:
  may_b:
    swap: false
    exclusive: true
    members: ["qwen38-api", "qwen35-api"]

# ==========================================================================
# !! DINH CHINH 13/09/2026 - `ttl: 0` DA GAY MOT SU CO THAT, va no bi THAY.
#
#    Chu san pham chot: *"co che nha model sau 30p khong hoat dong van giu, no
#    se nha lai ve RAM"*. Ho so nay nay dat `ttl: ${TTL_NHA}` = 1800 giay.
#
#    Khoi van ban ben duoi giai thich vi sao `ttl: 0` **tung** dung. Giu nguyen
#    de truy vet - nhung no thieu MOT su that, va su that do da den sau:
#
#    !! NGAY 13/09 `qwen35-api` NGUNG PHUC VU HOAN TOAN. Do duoc:
#
#        VRAM trong 536 MiB < san 600 MiB cua card chay qwen35-api
#        => cong tu choi moi luot moi, `ltt-3.5` tra 503 ba lan lien tiep
#
#      Nguyen nhan khong phai mot loi ma: 5060 Ti giu ca desktop Windows (L-12
#      don moi thu do sang day de 3090 chi chay AI), va bien 1.002 MiB sau MTP
#      khong du cho desktop + mmproj cung luc. Voi `ttl: 0`, model **khong bao
#      gio** nha, nen card khong co duong tu thoat khoi trang thai do.
#
#    => `ttl: 0` doi lay "khong ai phai cho 15 giay" bang "card khong bao gio
#      hoi phuc duoc". Phep doi ay sai o phia dat: 15 giay la mot lan cho, con
#      card ket la **mat han mot model** cho toi khi co nguoi vao tay.
#
#    [do] Gia THAT cua viec nha, do 13/09 (khong lay tu G5, do lai bang dong ho):
#
#        | model      | nap am (tong) | da san | gia NAP |
#        |------------|---------------|--------|---------|
#        | qwen35-api |     12,76 s   | 2,23 s | ~10,5 s |
#        | qwen38-api |     20,35 s   | 0,97 s | ~19,4 s |
#
#      Khop co voi G5 (10,12 / 15,23 s) => hai phep do doc lap cung noi mot dieu.
#
#    * VA `preload` VAN GIU. Hai co nay khong loai tru nhau, chung tra loi hai
#      cau khac nhau:
#         `preload`      -> luc KHOI DONG dich vu, khong ai phai cho
#         `ttl: 1800`    -> sau 30 phut RANH, tra card ve cho he thong
#      Bo `preload` moi la thu lam song lai "khach dau tien cho 15 giay".
#
# ==========================================================================
# THUONG TRU: khoi duoi day viet khi ho so con `ttl: 0`. Giu de truy vet.
#
# `ttl: 0` trong llama-swap = TAT dong ho nha (khong phai "nha ngay"). Cong voi
# `hooks.on_startup.preload`, hai model nap mot lan luc dich vu khoi dong roi
# nam do.
#
# Vi sao: nap tu kho AM do duoc 15,23 s (3.8) va 10,12 s (3.5), phuong sai
# +/-0,05 s; tu kho LANH uoc <= 16,9 / 10,9 s (chi dat hon 7-11 %, vi nut that
# khong phai doc tep ma la day trong so len GPU). (G5)
# => Mot khach phai cho 15 giay chi vi ho la nguoi dau tien goi sau mot khoang
#    lang la mot lan hong TRANH DUOC, va `preload` tra cai gia do dung MOT lan.
#
# !! Va day la GIA DINH cua mot ket luan o tai lieu khac: G5 noi "truong hop
#    lanh gan nhu khong xay ra" CHINH VI ho so nay dat `ttl: 0` + `preload`. Bo
#    mot trong hai la lam sai mot con so o `10_BENCHMARK_P3.md` va o trong tai
#    residency (Task 5.2/5.4) - doi thi phai doi ca do.
#
# `unloadTimeout: 30` van giu tren ca hai: nha PHAI co han. Mot tien trinh khong
# chiu chet la card khong bao gio ve, va trong tai residency (Task 5.4) can thao
# duoc `qwen38-api` khoi 3090 de nhuong cho ComfyUI.
#
# `concurrencyLimit: 8` - llama-swap dem o day so request no CHUYEN VAO cung
# luc; `-np` la so slot cua engine. Rang buoc: >= 2 x so slot (`test_1215`).
#   Vi sao khong de bang `-np`: request vuot `-np` se bi llama-swap giu lai, va
#   may A khong bao gio thay hang doi cua engine. De gap doi tro len thi hang doi
#   nam TRONG llama.cpp - noi `/metrics` dem duoc (`requests_deferred`), tuc noi
#   ta nhin thay neu rao cua cong va engine lech nhau.
#   (PHUONG AN C, 17/09) `-c`/`-np` cua TUNG ho so trong CHINH tep nay la nguon
#   vat ly: cong LLM (`llm_gateway/vat_ly.py`) doc thang chung luc khoi dong
#   (seq <= -np, tong dat cho <= -c, tran vao = -c - max_out - DEM_UOC). May A
#   giu ban sao chinh sach o ho so theo model cua `apps/ltt_llm/ngan_sach.py`,
#   va `test_334`/`test_1201`/`test_1223` buoc hai ben khop. Doi `-c`/`-np` o day
#   => doi ho so may A cung changeset; TANG thi may B truoc, GIAM thi may A truoc
#   (`docs/ltt_llm_dual/RUNBOOK.md` muc 2.1).
#
# !! O-19 (DONG 17/09): `--no-cache-idle-slots` tung thay tren `/running` may B la
#    phep do ma tran cache C1 TAM THOI cua phien Serving V2, KHONG phai cau hinh
#    production; phien do da hoan nguyen yaml tren B ve ban goc (co trung kho).
#    Tep nay dung. Doi yaml tren B de do: bao truoc, hoan nguyen ngay sau do.
#
# !! DINH CHINH 18/09/2026 - `--cache-ram` VA `--ctx-checkpoints` NAY DUOC KHAI.
#
#    Khoi cu o day viet: *"KHONG khai `--cache-ram` ... giu MAC DINH cua engine
#    va noi thang ra rang no CHUA DUOC DO"*, va no liet ke dung dieu kien de doi
#    y: *"thu no doi la ti le tai dung prompt cache GIUA cac luot, va do duoc ...
#    SAU khi deploy, tuc co duong do lai"*.
#
#    Dieu kien do da THOA. Phep do 18/09 (`docs/ltt_llm_dual/artifacts/
#    bench_hang_cho/KET_QUA_CACHE_18_09.md`) do tren DUNG cau hinh nay, qua
#    production, doi chung bang `prompt eval time` cua chinh engine:
#
#      * cache tien to CHAY: 99,58-99,64 % token trung, TTFT 5,8-26,6 s -> ~1,0-1,9 s
#      * va log may B ghi 8 LAN `making room for prompt cache entry, removing
#        oldest entry` voi `size = 885.686 MiB` (va 410,8 MiB) trong chinh phien
#        do => o ~886 MiB/hoi thoai, mac dinh 8192 MiB chi chua ~9 hoi thoai.
#
#    => `--cache-ram 24576` (24 GiB MOI model) - L-25, chu du an chot 18/09,
#       CUNG LUC ha san RAM cua cong B `LTT_LLM_RAM_TRONG_GB` 48 -> 24.
#
#    !! LICH SU: L-24 (sang 18/09) da bat 24576 voi san 48 va MAY B NGUNG BAN
#       ~10 phut: hai model vua nap, cache rong -> RAM trong 85,0 GiB; sau 28
#       hoi thoai ~10K token -> 44,2 GiB (< 48) => trong tai cong B tu choi MOI
#       luot ca hai model (`ban_trong_tai=36`) trong khi 6 slot deu ranh. L-24 ha
#       cache ve 12288. L-25 giu 24576 va sua CHO SAI THAT: san 48 khong phai
#       rang buoc cua LLM (no chep tu san cua du an VIDEO/ComfyUI, `CHIA_GPU_VOI_
#       VIDEO.md` muc 1: 23 GB -> VRAM 98 %, 4 GB -> Windows sap 19/08).
#
#    ! `--cache-ram` BO GI (llama.cpp, doc ma `tools/server/server-task.cpp`
#      `server_prompt_cache::alloc/update`, PR #16391):
#        * MOT bo nho cache cho MOI tien trinh llama-server (khong theo slot);
#          don vi MiB; -1 = khong gioi han, 0 = tat.
#        * size moi entry = KV dich + KV draft (MTP) + checkpoint CUA entry do;
#          truoc khi cap phat, duoi entry cu nhat toi khi vua (`making room`);
#          entry lon hon ca tran thi bo qua (`exceeds cache size limit`).
#        * KHONG tinh: checkpoint SONG cua slot (np x ctx-checkpoints x
#          ~112-150 MiB, #25437/#28194) va bo dem khac cua tien trinh. Het
#          tran chi la han mem theo tong entry, khong phai tran RSS.
#        * Giai phong: chi khi duoi entry, hoac tien trinh chet (unload/restart).
#          San RAM cua cong chi CHAN LUOT MOI - no KHONG xa cache.
#
#    Phep tinh ngan sach (GiB, psutil.available; lam lai khi doi MOT trong ba so):
#
#      RAM trong luc cache rong (2 model nap)          85,0   (do 18/09)
#      - 3.8: 24 cache + 3 slot x 8 ckpt x 0,15       -27,6
#      - 3.5: 24 cache + 4 slot x 8 ckpt x 0,15       -28,8   (np4 tu L-28)
#      = RAM trong xau nhat                            ~28,6
#      - LTT_LLM_RAM_TRONG_GB                          -24
#      = bien tren san                                  ~4,6
#
#    `tests/test_1293_ngan_sach_ram_may_b.py` doi chieu yaml + `deploy.ps1` +
#    `llm_gateway/config.py` bang phep tinh nay.
#
#    !! Duong ANH (cong render, `LTT_RENDER_RAM_TRONG_GB` = 48, san RIENG):
#       khi cu tru 3090 chuyen sang anh, 3.8 bi unload (cache 3.8 mat theo tien
#       trinh) nhung cache 3.5 (5060 Ti) VAN O LAI toi 24 GiB. So do phep chuyen
#       + RAM ComfyUI: `KET_QUA_BAO_TRI_18_09.md` phu luc L-25.
#
#    !! DUNG NANG `--cache-ram` hay HA san ma khong lam lai phep tinh tren.
#
#    => `--ctx-checkpoints 8` (mac dinh 32). Mot entry cache goi ca KV + trang
#       thai draft MTP + MOI checkpoint; checkpoint model lai do duoc 112-150
#       MiB/cai (upstream #28194, #24055), tuc 32 checkpoint ~4,8 GiB TRUOC phan
#       KV - chinh la ly do entry phinh toi 886 MiB. Danh doi: mat do diem lui
#       thua hon. Ti le trung sau khi doi DA duoc do lai, khong suy:
#       `docs/ltt_llm_dual/artifacts/bench_hang_cho/KET_QUA_BAO_TRI_18_09.md`.
#
#    ! Ten co, doi chieu `llama-server.exe --help` cua chinh build b10883 dang
#      chay (KHONG lay tu tri nho): `-cram, --cache-ram N` (MiB, mac dinh 8192)
#      va `-ctxcp, --ctx-checkpoints, --swa-checkpoints N` (mac dinh 32).
#      DINH CHINH mot cau o KET_QUA_CACHE_18_09 muc 4: `--swa-checkpoints` CO ton
#      tai - no la BI DANH cua `--ctx-checkpoints`, khong phai mot co khac.
#
#    ! Va hai co nay dat o TUNG ho so chu khong o macro `CHUNG`, cung ly do voi
#      `--spec-type`: muc cache hop ly la thuoc tinh cua tung model (kich thuoc
#      entry khac nhau), va ho so thu ba them sau khong duoc thua huong mot con
#      so do cho model khac.
#
# !! VAN GIU: KHONG them `--no-cache-idle-slots`. Chinh no tao ra ket luan sai
#    "3.5 prompt cache 0/30 hits" ngay 17/09 (KET_QUA_CACHE_18_09 muc 4). Mac dinh
#    cua engine la `--cache-idle-slots` BAT, va no "requires cache-ram" - tuc
#    `--cache-ram 0` cung tat duong nay. Dung dat 0.
# ==========================================================================

