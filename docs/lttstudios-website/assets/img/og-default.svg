<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d47a1"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#4A90D9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0d47a1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="450" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="510" y="140" width="180" height="180" rx="32" fill="#fff" opacity="0.95"/>
  <path d="M555 195h90M600 195v90M555 285h90" stroke="#1565C0" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="600" y="400" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="72" font-weight="800" fill="#fff" letter-spacing="-1">
    LTT Studios
  </text>

  <!-- Tagline -->
  <text x="600" y="460" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="28" font-weight="500" fill="#cbd5e1">
    Bulk video publishing for creators
  </text>

  <!-- URL -->
  <text x="600" y="560" text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="22" font-weight="600" fill="#4A90D9">
    lttstudios.com
  </text>
</svg>
