# Alembic — cong cu di tru luoc do CSDL.
#
# CO Y KHONG co dong "sqlalchemy.url" o day: chuoi ket noi chua MAT KHAU, ma
# file nay duoc theo doi trong git. Duong dan doc chuoi ket noi nam trong
# alembic/env.py, va no lay tu bien moi truong LTT_DATABASE_URL.
#
# Chay:
#   alembic upgrade head      # tien len ban moi nhat
#   alembic downgrade -1      # lui lai mot buoc
#   alembic revision --autogenerate -m "mo ta"   # sinh migration tu model

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Ten file migration co timestamp de sap xep theo thoi gian nhin thay ngay.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# KHONG dat INFO: muc do do in ca cau lenh SQL kem tham so ra log.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
