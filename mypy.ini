# Cau hinh `mypy` -- bat LOI HOP DONG HAM, khong bat thieu chu thich kieu.
#
# =========================================================================
# [!] TEP NAY PHAI THUAN ASCII. Day khong phai so thich.
#
#     `mypy` doc tep nay bang `configparser.read()`, va ham do mo tep voi
#     ENCODING CUA HE THONG (cp1252 tren may nay), khong phai UTF-8. Do
#     06/09: mot ban co emoji + dau tieng Viet lam mypy chet han
#     `UnicodeDecodeError: 'charmap' codec can't decode byte 0x90`, rc=2,
#     truoc khi kiem mot dong ma nao.
#
#     Day la CUNG MOT LOP loi voi luat `.ps1 phai thuan ASCII` trong
#     `CLAUDE.md` quy tac 2: mot tep cau hinh duoc doc theo bang ma ANSI thi
#     mot ky tu ngoai ASCII lam hong ca tep, va bao loi o cho khac.
# =========================================================================
#
# VI SAO `plugins = pydantic.mypy` LA DONG QUAN TRONG NHAT O DAY.
#
#     Do 06/09 tren `apps/autosubvideo/style_registry.py`:
#
#         KHONG plugin    60 loi   (58 trong so do la `call-arg` SAI)
#         CO   plugin      1 loi   (va no la loi THAT)
#
#     Khong co plugin, mypy khong hieu `Field("none", ...)` cua Pydantic v2 la
#     mot GIA TRI MAC DINH, nen no coi moi truong la BAT BUOC va bao "Missing
#     named argument" cho tung cai. Do la duong tinh gia hang loat -- dung mot
#     kieu voi `B008` cua ruff, va cach duy nhat nguoi ta phan ung voi hang
#     chuc canh bao sai la thoi doc ca bo.
#
# [*] Va loi CON LAI sau khi bat plugin la mot loi that:
#
#         style_registry.py:227  highlight_mode="all_text"
#         nhung  HighlightMode = Literal["none","word","underline","bg_flash"]
#
#     `SubtitleStyleConfig` (co kiem tra that luc chay) cho phep
#     `none|word|bg_flash|underline|all_text|keyword`, con bi danh
#     `HighlightMode` o `style_registry.py:21` thi CU. `FullStylePreset` la
#     `dataclass` nen no KHONG kiem tra gi luc chay, va `ass_builder.py:269`
#     co xu ly `all_text` that -- nen khong ai thay gi hong. Mot lech hop
#     dong song im lang.

[mypy]
plugins = pydantic.mypy

# Kho nay phan lon chua chu thich kieu. Bat `disallow_untyped_defs` o day la
# doi hang nghin dong khai bao truoc khi bat duoc mot loi nao -- nen KHONG
# bat. Thu can bat la loi HOP DONG: goi sai tham so, cham thuoc tinh khong
# ton tai.
ignore_missing_imports = True

# `tools/` khong co `__init__.py`, nen `tools/doctor.py` giai duoc ra CA HAI
# ten `doctor` va `tools.doctor` -> mypy chet han (rc 2, "Source file found
# twice under different module names").
explicit_package_bases = True
namespace_packages = True
mypy_path = .

# `import-untyped`: thu vien ngoai khong co stub (`requests`...). Do la trang
#   thai cua HE SINH THAI, khong phai loi cua kho nay.
# `annotation-unchecked`: chi la ghi chu, khong phai loi.
disable_error_code = import-untyped, annotation-unchecked

# Cung danh sach voi `ruff.toml` -- hai cong cu nhin cung mot pham vi thi mot
# tep duoc mien o cho nay khong bat ngo bi bat o cho kia.
#   core/         15.668 dong FB/TikTok cu, dong bang -- xem CLAUDE.md
#   cutclipshort/ engine VENDOR tu D:/FULL AUTO VIDEO -- khong bao tri o day
#   apps/transcript/services/engine/  engine cua `bot_transcript`, chuyen vao
#                 NGUYEN VEN de giu parity: "sua lint" cho no la lam no khong
#                 con giong ban da chay mot nam nua
exclude = (?x)(
    ^core/
    | ^cutclipshort/
    | ^apps/transcript/services/engine/
    | ^apps/audio_pause/services/engine/
    | ^apps/video_assembly/services/engine/
    | ^tmp/
    | ^dist/
    | ^build/
    | ^node_modules/
    | ^\.playwright-cli/
    | ^alembic/versions/
    )

# [!] `follow_imports = silent`: KHONG co dong nay thi mypy di THEO import vao
#     `cutclipshort/` du no nam trong `exclude`, va bao 5 loi `name-defined`
#     cua mot engine vendor. `exclude` chi loc thu duoc LIET KE, khong loc thu
#     duoc KEO VAO.
follow_imports = silent
